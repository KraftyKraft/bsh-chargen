<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BSH Character Generator</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Black Sword Hack</h1>
    <p>Character Generator</p>
  </header>
  <main>
    <button id="generate" class="generate-btn">Generate</button>
    <div id="sheet" class="sheet">
      <p class="placeholder">Press generate to roll a character.</p>
    </div>
  </main>
  <footer>
    <a href="https://blackswordhack.github.io/" target="_blank" rel="noopener">
      <img src="assets/bsh-compatible-logo.png" alt="Compatible with Black Sword Hack" class="compat-logo">
    </a>
    <p>Rules from <a href="https://blackswordhack.github.io/" target="_blank" rel="noopener">Black Sword Hack: Ultimate Chaos Edition</a> by Kobayashi &amp; The Merry Mushmen.</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/generator.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
